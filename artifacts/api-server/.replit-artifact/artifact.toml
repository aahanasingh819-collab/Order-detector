kind = "api"
previewPath = "/"
title = "Order Detector"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "Order Detector"
paths = ["/"]

[services.development]
run = "cd ../.. && python manage.py migrate && python manage.py seed_orders && python manage.py runserver 0.0.0.0:8080"

[services.production]

[services.production.build]
args = ["python", "manage.py", "collectstatic", "--noinput"]

[services.production.build.env]
DEBUG = "1"

[services.production.run]
args = ["sh", "-c", "python manage.py migrate && python manage.py seed_orders && gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 2"]

[services.production.run.env]
PORT = "8080"
DEBUG = "0"
ALLOWED_HOSTS = ".replit.app,.replit.dev,localhost,127.0.0.1"

[services.production.health.startup]
path = "/"